<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milkshake Details</title>
  <style>
    :root { font-family: 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: radial-gradient(circle at top right, #fff8f1, #f4e3d1 50%, #fdf7ef); color: #412a1f; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 48px; border-bottom: 1px solid rgba(141,95,79,.12);
      background: rgba(253,247,239,.9); backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 10;
    }
    .logo { font-size: 0.85rem; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c4f; }
    .hlinks { display: flex; gap: 10px; }
    .hlinks a {
      text-decoration: none; color: #8d5f4f; font-weight: 700; padding: 9px 18px;
      background: rgba(141,95,79,.12); border-radius: 999px; font-size: 0.9rem; transition: background 0.2s;
    }
    .hlinks a:hover { background: rgba(141,95,79,.22); }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: calc(100vh - 65px);
    }

    /* Left: big swatch */
    .left {
      display: flex; align-items: center; justify-content: center;
      padding: 56px;
      background: rgba(255,255,255,.5);
      border-right: 1px solid rgba(196,162,143,.25);
    }
    .big-swatch {
      width: 320px; height: 420px; border-radius: 40px;
      background: linear-gradient(135deg,#e6d5c3,#c4a28f);
      box-shadow: 0 40px 100px rgba(109,68,42,.2);
    }

    /* Right: info */
    .right {
      display: flex; flex-direction: column; justify-content: center;
      padding: 64px 72px; gap: 24px;
    }
    .right h1 { font-size: clamp(2rem, 3vw, 3.5rem); color: #3d2920; line-height: 1.1; }
    .right p { color: #6b4d42; line-height: 1.7; font-size: 1rem; }
    .price { font-size: 3rem; font-weight: 800; color: #8d5f4f; }

    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
    .btn-add {
      padding: 16px 32px; background: #8d5f4f; color: white; border: none;
      border-radius: 999px; font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: background 0.2s; font-family: inherit;
    }
    .btn-add:hover { background: #a06d5f; }
    .btn-add:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-sec {
      padding: 14px 24px; background: rgba(141,95,79,.12); color: #5f463a;
      border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 0.9rem; transition: background 0.2s;
    }
    .btn-sec:hover { background: rgba(141,95,79,.2); }

    /* Empty state */
    .empty-layout {
      grid-column: 1 / -1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 80px; text-align: center; gap: 16px;
    }
    .empty-layout h2 { font-size: 2rem; color: #593b2e; }
    .empty-layout p { color: #7a5c4f; }
    .empty-layout a {
      display: inline-block; text-decoration: none; color: white; background: #8d5f4f;
      padding: 14px 28px; border-radius: 999px; font-weight: 700; margin-top: 8px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Milkshake Details</div>
    <div class="hlinks">
      <a href="cart.html">Warenkorb <span id="cartBadge" style="background:rgba(141,95,79,.16);padding:2px 9px;border-radius:999px;font-size:.82rem;font-weight:700;color:#5f463a;"></span></a>
      <a href="milkshake.html">← Zurück zum Mixer</a>
    </div>
  </header>

  <div class="layout" id="mainLayout">
    <!-- filled by JS -->
  </div>

  <script src="cart-system.js"></script>
  <script>
    const gradients = {
      'Erdbeer-Klassik':'linear-gradient(135deg,#ffafbd,#ffc3a0)',
      'Doppelte Schokolade':'linear-gradient(135deg,#4b382a,#8d5f4f)',
      'Vanilletraum':'linear-gradient(135deg,#fff3b0,#caa75b)',
      'Pistazien-Wirbel':'linear-gradient(135deg,#b5e3a3,#7ca982)',
      'Salzkaramell-Crunch':'linear-gradient(135deg,#e29578,#dd6e42)',
      'Keks & Creme':'linear-gradient(135deg,#d3d3d3,#4a4a4a)',
      'Beeren-Käsekuchen':'linear-gradient(135deg,#ffafbd,#d05090)',
      'Bananensplit-Genuss':'linear-gradient(135deg,#fff3b0,#caa75b)',
      'Mango-Tango':'linear-gradient(135deg,#f9d423,#ff4e50)',
      'Minz-Schoko-Splinter':'linear-gradient(135deg,#93f5d5,#4b382a)',
    };

    const badge = document.getElementById('cartBadge');
    const updateBadge = () => badge.textContent = window.CartSystem.getCart().length;
    const layout = document.getElementById('mainLayout');

    const milkshake = window.CartSystem.getLastMilkshake();

    if (!milkshake) {
      layout.innerHTML = `<div class="empty-layout">
        <h2>Noch kein Shake ausgewählt</h2>
        <p>Mixe zuerst einen Milkshake. Dann erscheint er hier.</p>
        <a href="milkshake.html">Zum Mixer</a>
      </div>`;
    } else {
      const grad = gradients[milkshake.title] || 'linear-gradient(135deg,#e6d5c3,#c4a28f)';
      layout.innerHTML = `
        <div class="left">
          <div class="big-swatch" style="background:${grad}"></div>
        </div>
        <div class="right">
          <h1>${milkshake.title || '—'}</h1>
          <p>${milkshake.description || ''}</p>
          <div class="price">€${Number(milkshake.cost||0).toFixed(2)}</div>
          <div class="btn-row">
            <button class="btn-add" id="addBtn">In den Warenkorb</button>
            <a class="btn-sec" href="cart.html">Zum Warenkorb</a>
          </div>
        </div>`;

      document.getElementById('addBtn').addEventListener('click', function() {
        window.CartSystem.addMilkshake(milkshake);
        updateBadge();
        this.textContent = 'Hinzugefügt ✓'; this.disabled = true;
        setTimeout(() => { this.textContent = 'In den Warenkorb'; this.disabled = false; }, 1500);
      });
    }

    updateBadge();
  </script>
</body>
</html>
