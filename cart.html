<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milkshake-Warenkorb</title>
  <style>
    :root { font-family: 'Segoe UI', sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; background: radial-gradient(circle at top right, #fff8f1, #f4e3d1 50%, #fdf7ef); color: #412a1f; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 48px; border-bottom: 1px solid rgba(141,95,79,.12);
      background: rgba(253,247,239,.9); backdrop-filter: blur(8px);
      position: sticky; top: 0; z-index: 10;
    }
    .logo { font-size: 0.85rem; letter-spacing: 0.18em; text-transform: uppercase; color: #7a5c4f; }
    .hlinks { display: flex; gap: 10px; }
    .hlinks a, .hlinks button {
      text-decoration: none; color: #8d5f4f; font-weight: 700; padding: 9px 18px;
      background: rgba(141,95,79,.12); border-radius: 999px; border: none;
      cursor: pointer; font-family: inherit; font-size: 0.9rem; transition: background 0.2s;
    }
    .hlinks a:hover, .hlinks button:hover { background: rgba(141,95,79,.22); }

    .layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 0;
      min-height: calc(100vh - 65px);
      align-items: start;
    }

    /* Left: item list */
    .cart-main { padding: 48px 56px; }
    .cart-main h1 { font-size: clamp(1.8rem, 2.5vw, 3rem); color: #3d2920; margin-bottom: 28px; }

    .item {
      display: grid; grid-template-columns: 80px 1fr auto;
      gap: 20px; align-items: center;
      padding: 18px 22px; border-radius: 20px;
      background: rgba(255,255,255,.85); border: 1px solid rgba(196,162,143,.25);
      margin-bottom: 14px;
    }
    .swatch { width: 80px; height: 100px; border-radius: 14px; flex-shrink: 0; }
    .details h3 { font-size: 1.05rem; color: #3d2920; margin-bottom: 4px; }
    .details p { font-size: 0.87rem; color: #6b4d42; line-height: 1.6; }
    .meta { text-align: right; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }
    .meta strong { color: #3d2920; font-size: 1.05rem; }
    .remove {
      background: rgba(237,148,105,.16); color: #8d4e3b; border: none;
      border-radius: 999px; padding: 7px 14px; cursor: pointer; font-weight: 700;
      font-size: 0.82rem; transition: background 0.2s; white-space: nowrap;
    }
    .remove:hover { background: rgba(237,148,105,.3); }

    /* Right: sticky summary panel */
    .summary-panel {
      padding: 48px 40px; border-left: 1px solid rgba(196,162,143,.25);
      background: rgba(255,255,255,.6); min-height: calc(100vh - 65px);
      display: flex; flex-direction: column; gap: 20px;
      position: sticky; top: 65px; align-self: start;
    }
    .summary-panel h2 { font-size: 1.3rem; color: #3d2920; }
    .summary-total { font-size: 2.4rem; font-weight: 800; color: #8d5f4f; }
    .summary-count { font-size: 0.88rem; color: #9a7060; }
    .divider { border: none; border-top: 1px solid rgba(196,162,143,.3); }
    .btn-primary {
      display: block; padding: 15px 24px; background: #8d5f4f; color: white;
      border-radius: 999px; text-align: center; text-decoration: none;
      font-weight: 700; font-size: 0.95rem; transition: background 0.2s; border: none; cursor: pointer; font-family: inherit;
    }
    .btn-primary:hover { background: #a06d5f; }
    .btn-ghost {
      display: block; padding: 13px 24px; background: rgba(141,95,79,.1); color: #5f463a;
      border-radius: 999px; text-align: center; text-decoration: none;
      font-weight: 700; font-size: 0.9rem; transition: background 0.2s; border: none; cursor: pointer; font-family: inherit;
    }
    .btn-ghost:hover { background: rgba(141,95,79,.2); }

    /* Empty state — full layout still */
    .empty-msg { padding: 48px 56px; }
    .empty-msg h2 { font-size: 1.8rem; color: #593b2e; margin-bottom: 12px; }
    .empty-msg p { color: #7a5c4f; margin-bottom: 24px; line-height: 1.7; }
    .empty-msg a {
      display: inline-block; text-decoration: none; color: white; background: #8d5f4f;
      padding: 13px 26px; border-radius: 999px; font-weight: 700;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Milkshake-Warenkorb</div>
    <div class="hlinks">
      <a href="milkshake.html">← Zurück zum Mixer</a>
      <button id="clearBtn">Warenkorb leeren</button>
    </div>
  </header>

  <div class="layout" id="mainLayout">
    <div class="cart-main">
      <h1>Dein Warenkorb</h1>
      <div id="cartList"></div>
      <div id="emptyMsg" class="empty-msg" style="display:none; padding: 0;">
        <p style="color:#7a5c4f;">Noch keine Shakes drin. Die Shakes brauchen dich.</p>
        <a href="milkshake.html" style="margin-top:12px;">Zum Mixer</a>
      </div>
    </div>

    <div class="summary-panel">
      <h2>Zusammenfassung</h2>
      <div class="summary-total" id="cartTotal">€0.00</div>
      <div class="summary-count" id="cartCount">0 Artikel</div>
      <hr class="divider">
      <a href="milkshake.html" class="btn-primary">Weiter mixen</a>
      <button class="btn-ghost" id="clearBtn2">Alles entfernen</button>
    </div>
  </div>

  <script src="cart-system.js"></script>
  <script>
    const gradients = {
      'Erdbeer-Klassik':'linear-gradient(135deg,#ffafbd,#ffc3a0)',
      'Doppelte Schokolade':'linear-gradient(135deg,#4b382a,#8d5f4f)',
      'Vanilletraum':'linear-gradient(135deg,#fff3b0,#caa75b)',
      'Pistazien-Wirbel':'linear-gradient(135deg,#b5e3a3,#7ca982)',
      'Salzkaramell-Crunch':'linear-gradient(135deg,#e29578,#dd6e42)',
      'Keks & Creme':'linear-gradient(135deg,#d3d3d3,#4a4a4a)',
      'Beeren-Käsekuchen':'linear-gradient(135deg,#ffafbd,#d05090)',
      'Bananensplit-Genuss':'linear-gradient(135deg,#fff3b0,#caa75b)',
      'Mango-Tango':'linear-gradient(135deg,#f9d423,#ff4e50)',
      'Minz-Schoko-Splinter':'linear-gradient(135deg,#93f5d5,#4b382a)',
    };

    const cartList = document.getElementById('cartList');
    const emptyMsg = document.getElementById('emptyMsg');

    const render = () => {
      const cart = window.CartSystem.getCart();
      cartList.innerHTML = '';
      let total = 0;
      if (!cart.length) {
        emptyMsg.style.display = 'block';
      } else {
        emptyMsg.style.display = 'none';
        cart.forEach((it, i) => {
          const cost = Number(it?.cost) || 0; total += cost;
          const el = document.createElement('div'); el.className = 'item';
          el.innerHTML = `
            <div class="swatch" style="background:${gradients[it?.title]||'linear-gradient(135deg,#e6d5c3,#c4a28f)'}"></div>
            <div class="details">
              <h3>${it?.title||'Milkshake'}</h3>
              <p>${it?.description||''}</p>
            </div>
            <div class="meta">
              <strong>€${cost.toFixed(2)}</strong>
              <button class="remove" data-i="${i}">Entfernen</button>
            </div>`;
          cartList.appendChild(el);
        });
      }
      document.getElementById('cartTotal').textContent = `€${total.toFixed(2)}`;
      document.getElementById('cartCount').textContent = `${cart.length} Artikel`;
    };

    cartList.addEventListener('click', e => {
      const b = e.target.closest('button[data-i]'); if (!b) return;
      window.CartSystem.removeAt(Number(b.dataset.i)); render();
    });
    const clear = () => { window.CartSystem.clear(); render(); };
    document.getElementById('clearBtn').addEventListener('click', clear);
    document.getElementById('clearBtn2').addEventListener('click', clear);
    render();
  </script>
</body>
</html>
