<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Milchshake-Warenkorb</title>
  <style>
    :root{background:#fdf7ef;color:#412a1f;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at top right,#fff8f1 0%,#f4e3d1 40%,#fdf7ef 100%)}
    .wrap{max-width:1280px;margin:0 auto;padding:32px 4vw 48px}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:32px}
    .logo{font-size:.95rem;letter-spacing:.18em;text-transform:uppercase;color:#7a5c4f}
    .actions{display:flex;gap:12px;flex-wrap:wrap}
    a,.actions button{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;color:#8d5f4f;font-weight:700;padding:10px 16px;background:rgba(141,95,79,.12);border-radius:999px;border:none;cursor:pointer;transition:transform .2s ease,background .2s ease}
    a:hover,.actions button:hover{transform:translateY(-1px);background:rgba(141,95,79,.2)}
    .card{padding:32px;background:rgba(255,255,255,.95);border-radius:40px;box-shadow:0 22px 70px rgba(109,68,42,.12)}
    h1{margin:0 0 16px;font-size:clamp(2rem,3vw,3rem);color:#3d2920}
    .list{display:grid;gap:18px}
    .item{display:grid;grid-template-columns:110px 1fr auto;gap:18px;align-items:center;padding:20px 22px;border-radius:28px;background:rgba(245,237,228,.95);border:1px solid rgba(196,162,143,.35)}
    .img{width:110px;height:140px;border-radius:24px;overflow:hidden;background:#f9f1ea}
    .img img{width:100%;height:100%;object-fit:cover;display:block}
    .details{display:grid;gap:6px}
    .details h3{margin:0;font-size:1.15rem;color:#593b2e}
    .details p{margin:0;color:#5f463a;font-size:.95rem;line-height:1.6}
    .meta{display:grid;gap:10px;text-align:right}
    .meta strong{display:block;color:#3d2920;font-size:1rem}
    .remove{background:rgba(237,148,105,.16);color:#8d4e3b;border:none;border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:700;transition:transform .2s ease,background .2s ease}
    .remove:hover{transform:translateY(-1px);background:rgba(237,148,105,.24)}
    .sum{margin-top:28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px}
    .sum strong{font-size:1.1rem;color:#3d2920}
    .empty{padding:42px;text-align:center;background:rgba(255,255,255,.95);border-radius:34px;box-shadow:0 14px 40px rgba(109,68,42,.08)}
    .empty h2{margin:0 0 16px;color:#593b2e}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">Milchshake-Warenkorb</div>
      <div class="actions">
        <a href="milkshake.html">Zurück zum Mixer</a>
        <button id="clearCartButton">Warenkorb leeren</button>
      </div>
    </header>

    <div class="card" id="cartCard">
      <h1>Dein Milchshake-Warenkorb</h1>
      <div class="list" id="cartList"></div>
      <div class="sum">
        <strong>Gesamt: <span id="cartTotal">€0.00</span></strong>
        <a href="milkshake.html">Weiter einkaufen</a>
      </div>
    </div>

    <div class="empty" id="emptyCart" style="display:none">
      <h2>Dein Warenkorb ist leer</h2>
      <p>Mixe einen Milchshake und füge ihn zum Warenkorb hinzu, um ihn hier zu sehen.</p>
      <a href="milkshake.html">Zum Mixer gehen</a>
    </div>
  </div>

  <script src="cart-system.js"></script>
  <script>
    const KEY_CART_DEFAULT_IMAGE = 'assets/image-1779900833516.png';
    const $ = (id) => document.getElementById(id);

    const cartList = $('cartList');
    const cartTotal = $('cartTotal');
    const emptyCart = $('emptyCart');
    const cartCard = $('cartCard');
    const clearBtn = $('clearCartButton');

    const render = () => {
      const cart = window.CartSystem.getCart();
      cartList.innerHTML = '';

      if (!cart.length) {
        cartCard.style.display = 'none';
        emptyCart.style.display = 'block';
        cartTotal.textContent = '€0.00';
        return;
      }

      cartCard.style.display = 'block';
      emptyCart.style.display = 'none';

      let total = 0;
      cart.forEach((it, i) => {
        const cost = Number(it?.cost) || 0;
        total += cost;

        const el = document.createElement('div');
        el.className = 'item';
        el.innerHTML = `
          <div class="img"><img src="${it?.imageUrl || KEY_CART_DEFAULT_IMAGE}" alt="${it?.title || 'Milchshake'}"></div>
          <div class="details">
            <h3>${it?.title || 'Milchshake'}</h3>
            <p>${it?.description || ''}</p>
            <p><strong>Gewinn:</strong> ${it?.prizeName || '—'}</p>
          </div>
          <div class="meta">
            <strong>€${cost.toFixed(2)}</strong>
            <button class="remove" data-i="${i}">Entfernen</button>
          </div>`;
        cartList.appendChild(el);
      });

      cartTotal.textContent = `€${total.toFixed(2)}`;
    };

    cartList.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-i]');
      if (!b) return;
      window.CartSystem.removeAt(Number(b.dataset.i));
      render();
    });

    clearBtn.addEventListener('click', () => {
      window.CartSystem.clear();
      render();
    });

    render();
  </script>
</body>
</html>
