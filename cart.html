<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warenkorb</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fdf7ef;
      color: #412a1f;
      margin: 0;
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .item {
      background: white;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      gap: 16px;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .item img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }
    .item-info { flex: 1; }
    button, a.btn {
      display: inline-block;
      padding: 10px 16px;
      background: #8d5f4f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      text-decoration: none;
      margin-top: 8px;
    }
    button:hover, a.btn:hover { background: #a06d5f; }
    .remove { background: #c0392b; }
    .remove:hover { background: #e74c3c; }
    .total { font-size: 1.2rem; font-weight: bold; margin: 20px 0; }
    .empty { text-align: center; padding: 40px; }
    a { color: #8d5f4f; }
  </style>
</head>
<body>

  <header>
    <h2>Warenkorb</h2>
    <a href="milkshake.html">Zuruck zum Mixer</a>
  </header>

  <div id="emptyMsg" class="empty" style="display:none">
    <h2>Dein Warenkorb ist leer</h2>
    <p>Misch dir zuerst einen Shake!</p>
    <a class="btn" href="milkshake.html">Zum Mixer</a>
  </div>

  <div id="cartItems"></div>
  <div id="cartTotal" class="total"></div>
  <div id="cartActions" style="display:none">
    <button onclick="emptyCart()">Warenkorb leeren</button>
    <a class="btn" href="milkshake.html">Weitershoppen</a>
  </div>

  <script src="cart-system.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const itemsDiv = document.getElementById("cartItems");
      const totalDiv = document.getElementById("cartTotal");
      const actionsDiv = document.getElementById("cartActions");
      const emptyMsg = document.getElementById("emptyMsg");

      itemsDiv.innerHTML = "";

      if (cart.length === 0) {
        emptyMsg.style.display = "block";
        totalDiv.textContent = "";
        actionsDiv.style.display = "none";
        return;
      }

      emptyMsg.style.display = "none";
      actionsDiv.style.display = "block";

      let total = 0;

      cart.forEach((item, i) => {
        total += parseFloat(item.price);
        itemsDiv.innerHTML += `
          <div class="item">
            <img src="${item.image}" alt="${item.flavor}">
            <div class="item-info">
              <strong>${item.flavor}</strong>
              <p>Mit ${item.base}, verfeinert mit ${item.topping}</p>
              <p>Gewinn: ${item.prize}</p>
              <p>${String(item.price).replace(".", ",")} €</p>
            </div>
            <button class="remove" onclick="removeItem(${i})">Entfernen</button>
          </div>
        `;
      });

      totalDiv.textContent = "Gesamt: " + total.toFixed(2).replace(".", ",") + " €";
    }

    function removeItem(index) {
      removeFromCart(index);
      renderCart();
    }

    function emptyCart() {
      clearCart();
      renderCart();
    }

    renderCart();
  </script>

</body>
</html>
