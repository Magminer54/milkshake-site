<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milkshake Dreams</title>
    <style>
        :root {
            color-scheme: light;
            background: #fdf7ef;
            color: #412a1f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top left, #fff9f0 0%, #f0e5d8 45%, #fdf7ef 100%);
            color: #412a1f;
        }
        header {
            padding: 24px 32px 0;
        }
        .logo {
            font-size: 0.95rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #7a5c4f;
        }
        .hero {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 52px;
            align-items: center;
            padding: 5vw 4vw 6vw;
            max-width: 1800px;
            margin: 0 auto;
        }
        .hero-copy {
            padding: 24px 0;
        }
        .hero-copy h1 {
            margin: 0;
            font-size: clamp(3rem, 4vw, 5.5rem);
            line-height: 0.95;
            letter-spacing: -0.05em;
            color: #3d2920;
        }
        .hero-copy p {
            margin: 24px 0 32px;
            max-width: 760px;
            font-size: 1.2rem;
            line-height: 1.95;
            color: #5f463a;
        }
        .hero-copy .cta-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 32px;
            background: #8d5f4f;
            color: #fff9f0;
            text-decoration: none;
            border-radius: 999px;
            font-size: 1rem;
            font-weight: 700;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: 0 18px 40px rgba(141,95,79,0.18);
        }
        .hero-copy .cta-button:hover,
        .hero-copy .cta-button:focus-visible {
            transform: translateY(-2px);
            background: #a06d5f;
            box-shadow: 0 22px 44px rgba(141,95,79,0.24);
        }
        .image-gallery {
            display: grid;
            place-items: center;
            min-height: 660px;
            position: relative;
            overflow: visible;
        }
        .image-stack {
            position: relative;
            width: min(100%, 920px);
            min-height: 640px;
            overflow: visible;
            background: transparent;
            box-shadow: none;
            animation: revealShake 0.9s ease-out both;
        }
        .image-stack img {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 92%;
            max-width: 640px;
            height: auto;
            object-fit: cover;
            object-position: center;
            border-radius: 32px;
            opacity: 0;
            transform: translate(-50%, -50%);
            animation: fadeBlend 24s ease-in-out infinite both;
            filter: drop-shadow(0 28px 60px rgba(85, 42, 20, 0.18));
            will-change: opacity;
        }
        .image-stack img:nth-child(1) { z-index: 4; animation-delay: 0s; }
        .image-stack img:nth-child(2) { z-index: 3; animation-delay: -6s; }
        .image-stack img:nth-child(3) { z-index: 2; animation-delay: -12s; }
        .image-stack img:nth-child(4) { z-index: 1; animation-delay: -18s; }
        .site-links {
            margin-top: 24px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .site-links a {
            color: #8d5f4f;
            text-decoration: none;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 999px;
            background: rgba(141,95,79,0.1);
            transition: background 0.2s ease;
        }
        .site-links a:hover,
        .site-links a:focus-visible {
            background: rgba(141,95,79,0.18);
        }
        @keyframes fadeBlend {
            0%, 22% { opacity: 1; }
            28%, 100% { opacity: 0; }
        }
        @keyframes revealShake {
            0% { transform: translateY(-18px) rotate(-1deg); opacity: 0.3; }
            40% { transform: translateY(8px) rotate(1deg); opacity: 1; }
            100% { transform: translateY(0) rotate(0); opacity: 1; }
        }
        @media (max-width: 960px) {
            .hero {
                grid-template-columns: 1fr;
            }
            .image-gallery {
                min-height: 520px;
            }
        }
        @media (max-width: 640px) {
            body {
                padding: 0;
            }
            .hero {
                padding: 20px;
                gap: 24px;
            }
            .hero-copy h1 {
                font-size: clamp(2.8rem, 12vw, 4.4rem);
            }
        }
        @media (max-width: 960px) {
            .hero {
                grid-template-columns: 1fr;
            }
            .slider-panel {
                min-height: 520px;
            }
        }
        @media (max-width: 640px) {
            body {
                padding: 0;
            }
            .hero {
                padding: 20px;
                gap: 24px;
            }
            .hero-copy h1 {
                font-size: clamp(2.8rem, 12vw, 4.4rem);
            }
            .slide {
                grid-template-columns: 110px 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">Milkshake Lounge</div>
    </header>

    <section class="hero">
        <div class="hero-copy">
            <h1>Make your milkshake dreams come true</h1>
            <p>Welcome to the creamiest corner of the web. Pick your flavor, swirl in toppings, and let our milkshake mixer randomize a dreamy shake just for you.</p>
            <a class="cta-button" href="milkshake.html">Milkshake Mixer</a>
            <div class="site-links">
                <a href="produkte.html">Produkte</a>
                <a href="about.html">Über uns</a>
                <a href="contact.html">Kontakt</a>
            </div>
        </div>

        <div class="image-gallery" aria-label="Milkshake gallery">
            <div class="image-stack">
                <img src="assets/image-1779900833516.png" alt="Strawberry milkshake">
                <img src="assets/image-1779900840670.png" alt="Chocolate milkshake">
                <img src="assets/image-1779900918696.png" alt="Pistachio milkshake">
            </div>
        </div>
    </section>
</body>
</html>
